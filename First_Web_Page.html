<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Site Personnel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
        }
        .sidebar {
            width: 250px;
            position: fixed;
            height: 100%;
            background-color: #f8f9fa;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }
        .sidebar img {
            border-radius: 50%;
            width: 200px;
            height: 200px;
            object-fit: cover;
            display: block;
            margin: 0 auto;
        }
        .sidebar nav {
            margin-top: 20px;
        }
        .sidebar nav a {
            display: block;
            margin-bottom: 10px;
            color: #333;
            text-decoration: none;
        }
        .sidebar nav a:hover {
            text-decoration: underline;
        }
        .sidebar .social-links {
            margin-top: 20px;
            text-align: center;
        }
        .sidebar .social-links a {
            margin: 0 5px;
        }
        .sidebar .social-links img {
            width: 40px;
            height: 40px;
        }
        .main-content {
            margin-left: 270px;
            padding: 20px;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <img src="Photo.png" alt="Ma photo">
        <nav>
            <a href="#about-me">About Me</a>
            <a href="#dernieres-nouvelles">Dernières nouvelles</a>
            <a href="#publications">Publications</a>
            <a href="#enseignements">Enseignements</a>
            <a href="#cv">CV</a>
        </nav>
        <div class="social-links">
            <a href="https://github.com/ton-nom-utilisateur" target="_blank">
                <img src="GitHub.png" alt="GitHub">
            </a>
            <a href="https://fr.linkedin.com/in/volodimir-mitarchuk-a1146761" target="_blank">
                <img src="In.png" alt="LinkedIn">
            </a>
        </div>
    </div>
    <div class="main-content">
        <section id="about-me">
            <h2>About Me</h2>
            <p>Contenu à propos de moi...</p>
        </section>
        <section id="dernieres-nouvelles">
            <h2>Dernières nouvelles</h2>
            <p>Contenu des dernières nouvelles...</p>
        </section>
        <section id="publications">
            <h2>Publications</h2>
            <p>Contenu des publications...</p>
        </section>
        <section id="enseignements">
            <h2>Enseignements</h2>
            <p>Contenu des enseignements...</p>
        </section>
        <section id="cv">
            <h2>CV</h2>
            <p>Contenu du CV...</p>
        </section>
    </div>
</body>
</html>
